services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bandmanager
      POSTGRES_USER: bandmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandmanager -d bandmanager"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: bandmanager-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=bandmanager;Username=bandmanager;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      # secret.key, uploads/, catalog/, branding/, flyer-cache/ all live
      # here - back this up (alongside a pg_dump of the db volume) the same
      # way the old app's "copy the data/ folder" convention worked. Losing
      # secret.key permanently strands every stored platform credential.
      # A host bind mount (not a named volume) so it's a plain folder you
      # can browse/back up directly, and so BandManager.Migrate (run
      # natively on the host, not in a container) can write into it.
      - ./data:/app/data
    ports:
      - "8080:8080"

  # A second instance of the exact same image, same database, same data/
  # folder (so a login session, uploads, everything stay in sync - this
  # is a stable window onto the same real app, not a disposable sandbox).
  # No `build:` of its own - it just runs whatever `app` most recently
  # built, so rebuilding/redeploying `app` during active work never takes
  # this one down. To catch it up to the latest build once you're ready:
  # `docker compose stop app-test && docker compose rm -f app-test &&
  # docker compose up -d app-test` - same recreate pattern as `app`.
  # One caveat worth knowing: if a schema migration ever runs against the
  # shared database while this is still on older code, it could briefly
  # be out of sync until it's caught up the same way - fine for the
  # additive-only migrations this project has had so far, but real for
  # anything that renames/removes a column.
  app-test:
    image: bandmanager-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=bandmanager;Username=bandmanager;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - ./data:/app/data
    ports:
      - "8181:8080"

volumes:
  pgdata:
