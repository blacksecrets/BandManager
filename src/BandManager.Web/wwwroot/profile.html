<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<link rel="stylesheet" href="/assets/dashboard.css">
<link rel="stylesheet" href="/assets/settings.css">
<link rel="stylesheet" href="/assets/profile.css">
</head>
<body>
    <header class="topbar">
        <span class="brand-logo-slot"></span>
        <span class="role-badge" id="role-badge" hidden></span>
        <h1>Profile</h1>
        <nav class="main-nav" id="main-nav"></nav>
        <form method="POST" action="/logout"><button class="logout-btn" type="submit">Log out</button></form>
    </header>

    <main class="settings-main">

        <section class="platform-card">
            <h2>Your account</h2>
            <p id="whoami" class="save-note"></p>
            <p id="must-change-password-banner" class="verify-error-banner" hidden>Your password was set by an admin - please choose your own below.</p>

            <form id="username-form" class="cred-form">
                <label>Username / Email <span class="field-hint">(also where "Forgot password" sends a reset link - not shown to anyone else)</span>
                    <input type="email" name="username" required>
                </label>
                <button type="submit">Save username</button>
                <p id="username-status" class="save-note"></p>
            </form>

            <form id="password-form" class="cred-form">
                <label>Current password <input type="password" name="currentPassword" required></label>
                <label>New password <input type="password" name="newPassword" minlength="8" pattern="(?=.*[A-Z])(?=.*[^A-Za-z0-9]).{8,}" title="At least 8 characters, including one uppercase letter and one special character." required></label>
                <label>Confirm new password <input type="password" name="confirmPassword" minlength="8" required></label>
                <p class="field-hint password-requirements">At least 8 characters, including one UPPERCASE letter and one special character (like ! @ # $).</p>
                <button type="submit">Change password</button>
                <p id="password-status" class="save-note"></p>
            </form>
        </section>

    </main>

    <script src="/assets/profile.js"></script>
    <script src="/assets/branding.js"></script>
    <script src="/assets/topNav.js"></script>
    <script src="/assets/bandSwitcher.js"></script>
    <script src="/assets/password-toggle.js"></script>
    <script src="/assets/testModeBanner.js"></script>
</body>
</html>
