<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset password</title>
<link rel="stylesheet" href="/assets/auth.css">
</head>
<body>
    <form class="auth-box" id="reset-password-form">
        <span class="brand-logo-slot"></span>
        <h1>Reset password</h1>
        <label>New password<input type="password" name="newPassword" minlength="8" pattern="(?=.*[A-Z])(?=.*[^A-Za-z0-9]).{8,}" title="At least 8 characters, including one uppercase letter and one special character." required></label>
        <label>Confirm new password<input type="password" name="confirmPassword" minlength="8" required></label>
        <p class="field-hint password-requirements">At least 8 characters, including one UPPERCASE letter and one special character (like ! @ # $).</p>
        <button type="submit">Reset password</button>
        <p id="status" class="auth-note" hidden></p>
        <a class="back-to-login" href="/login.html">&larr; Back to login</a>
    </form>
    <script src="/assets/branding.js"></script>
    <script src="/assets/password-toggle.js"></script>
    <script src="/assets/reset-password.js"></script>
</body>
</html>
