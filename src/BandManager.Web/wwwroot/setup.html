<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Set up Crew Dashboard</title>
<link rel="stylesheet" href="/assets/auth.css">
</head>
<body>
    <form class="auth-box" method="POST" action="/setup" id="setup-form">
        <span class="brand-logo-slot"></span>
        <h1>Set up the crew dashboard</h1>
        <p>No admin account exists yet. Create the first one.</p>
        <label>Username<input type="text" name="username" required autofocus></label>
        <label>Password (8+ characters)<input type="password" name="password" minlength="8" required></label>
        <label>Confirm password<input type="password" name="confirmPassword" minlength="8" required></label>
        <p class="field-error" id="setup-password-error" hidden>Passwords don't match.</p>
        <button type="submit">Create account</button>
    </form>
    <script src="/assets/branding.js"></script>
    <script src="/assets/password-toggle.js"></script>
    <script>
        document.getElementById('setup-form').addEventListener('submit', (e) => {
            const form = e.target;
            const error = document.getElementById('setup-password-error');
            if (form.password.value !== form.confirmPassword.value) {
                e.preventDefault();
                error.hidden = false;
            } else {
                error.hidden = true;
            }
        });
    </script>
</body>
</html>
