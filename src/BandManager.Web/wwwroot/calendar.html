<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<link rel="stylesheet" href="/assets/dashboard.css">
<link rel="stylesheet" href="/assets/settings.css">
<link rel="stylesheet" href="/assets/calendar.css">
</head>
<body>
    <header class="topbar">
        <span class="brand-logo-slot"></span>
        <span class="role-badge" id="role-badge" hidden></span>
        <h1>Calendar</h1>
        <nav class="main-nav" id="main-nav"></nav>
        <form method="POST" action="/logout"><button class="logout-btn" type="submit">Log out</button></form>
    </header>

    <main class="settings-main">
        <p id="calendar-no-band" class="save-note" hidden>Select a band from the switcher above to see its calendar.</p>

        <div id="calendar-content" hidden>
            <div class="calendar-nav-row">
                <button type="button" id="calendar-prev-month">&larr;</button>
                <h2 id="calendar-month-label"></h2>
                <button type="button" id="calendar-next-month">&rarr;</button>
                <button type="button" id="calendar-today-btn">Today</button>
                <button type="button" id="calendar-recurring-btn" hidden>Recurring Schedule</button>
            </div>

            <div class="calendar-grid" id="calendar-grid"></div>
        </div>
    </main>

    <div id="calendar-day-modal-backdrop" class="detail-modal-backdrop" hidden>
        <div class="detail-modal">
            <button type="button" class="detail-modal-close" id="calendar-day-modal-close">&times;</button>
            <div id="calendar-day-modal-body"></div>
        </div>
    </div>

    <div id="calendar-rehearsal-modal-backdrop" class="detail-modal-backdrop" hidden>
        <div class="detail-modal">
            <button type="button" class="detail-modal-close" id="calendar-rehearsal-modal-close">&times;</button>
            <h2 id="calendar-rehearsal-modal-title">Rehearsal</h2>
            <form id="calendar-rehearsal-form">
                <label>Title <input type="text" id="calendar-rehearsal-title" placeholder="Rehearsal"></label>
                <label>Location <input type="text" id="calendar-rehearsal-location"></label>
                <label>Start time <input type="time" id="calendar-rehearsal-start" required></label>
                <label>End time <input type="time" id="calendar-rehearsal-end" required></label>
                <div class="calendar-modal-actions">
                    <button type="submit">Save</button>
                    <button type="button" id="calendar-rehearsal-delete" hidden>Delete</button>
                </div>
            </form>
        </div>
    </div>

    <div id="calendar-recurring-modal-backdrop" class="detail-modal-backdrop" hidden>
        <div class="detail-modal">
            <button type="button" class="detail-modal-close" id="calendar-recurring-modal-close">&times;</button>
            <h2>Recurring Rehearsal Schedule</h2>
            <div id="calendar-recurring-list" class="calendar-roster-list"></div>
            <h3>Add a schedule</h3>
            <form id="calendar-recurring-form">
                <label>Day
                    <select id="calendar-recurring-day">
                        <option>Sunday</option><option>Monday</option><option>Tuesday</option>
                        <option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option>
                    </select>
                </label>
                <label>Start time <input type="time" id="calendar-recurring-start" required></label>
                <label>Duration (minutes) <input type="number" id="calendar-recurring-duration" value="120" min="15" max="720"></label>
                <label>Location <input type="text" id="calendar-recurring-location"></label>
                <div class="calendar-modal-actions">
                    <button type="submit">Add</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/assets/calendar.js"></script>
    <script src="/assets/branding.js"></script>
    <script src="/assets/topNav.js"></script>
    <script src="/assets/bandSwitcher.js"></script>
</body>
</html>
