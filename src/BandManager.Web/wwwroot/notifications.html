<!DOCTYPE html>
<html lang="en">
<head>

        <span class="brand-logo-slot"></span>
        <span class="role-badge" id="role-badge" hidden></span>

        <section class="platform-card">
            <h2>Your notifications</h2>
            <div id="notifications-grid"></div>
        </section>
    </main>

    <script src="/assets/dataGrid.js"></script>

    <script src="/assets/songReview.js"></script>
