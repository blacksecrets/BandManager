<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications</title>
<link rel="stylesheet" href="/assets/dashboard.css">
<link rel="stylesheet" href="/assets/settings.css">
<link rel="stylesheet" href="/assets/profile.css">
<link rel="stylesheet" href="/assets/dataGrid.css">
</head>
<body>
    <header class="topbar">
        <span class="brand-logo-slot"></span>
        <span class="role-badge" id="role-badge" hidden></span>
        <h1>Notifications</h1>
        <nav class="main-nav" id="main-nav"></nav>
        <form method="POST" action="/logout"><button class="logout-btn" type="submit">Log out</button></form>
    </header>

    <main class="settings-main">
        <section class="platform-card" id="pending-review-section" hidden>
            <h2>Edit requests awaiting review</h2>
            <div id="pending-review-grid"></div>
        </section>

        <section class="platform-card">
            <h2>Your notifications</h2>
            <div id="notifications-grid"></div>
        </section>
    </main>

    <div id="notification-detail-modal-backdrop" class="detail-modal-backdrop" hidden>
        <div class="detail-modal">
            <button type="button" class="detail-modal-close" id="notification-detail-close">&times;</button>
            <p class="save-note" id="notification-detail-from"></p>
            <p class="save-note" id="notification-detail-received"></p>
            <p id="notification-detail-message"></p>
            <div class="cred-form-buttons">
                <button type="button" id="notification-detail-delete-btn" class="remove-btn">Delete</button>
                <button type="button" id="notification-detail-close-btn">Close</button>
            </div>
        </div>
    </div>

    <div id="notification-delete-confirm-modal-backdrop" class="detail-modal-backdrop" hidden>
        <div class="detail-modal">
            <h2>Delete this notification?</h2>
            <p class="save-note">This can't be undone.</p>
            <div class="cred-form-buttons">
                <button type="button" id="notification-delete-confirm-yes-btn">Yes</button>
                <button type="button" id="notification-delete-confirm-no-btn">No</button>
            </div>
        </div>
    </div>

    <script src="/assets/dataGrid.js"></script>
    <script src="/assets/notifications.js"></script>
    <script src="/assets/songReview.js"></script>
    <script src="/assets/branding.js"></script>
    <script src="/assets/topNav.js"></script>
    <script src="/assets/bandSwitcher.js"></script>
    <script src="/assets/testModeBanner.js"></script>
</body>
</html>
