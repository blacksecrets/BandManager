<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot password</title>
<link rel="stylesheet" href="/assets/auth.css">
</head>
<body>
    <form class="auth-box" id="forgot-password-form">
        <span class="brand-logo-slot"></span>
        <h1>Forgot password</h1>
        <p>Enter your username and, if that account has an email on file, we'll send a link to reset your password.</p>
        <label>Username<input type="text" name="username" required autofocus></label>
        <button type="submit">Send reset link</button>
        <p id="status" class="auth-note" hidden></p>
        <a class="back-to-login" href="/login.html">&larr; Back to login</a>
    </form>
    <script src="/assets/branding.js"></script>
    <script src="/assets/forgot-password.js"></script>
</body>
</html>
